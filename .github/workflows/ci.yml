name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @jobtrace/runner exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @jobtrace/runner exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @jobtrace/runner exec playwright install-deps chromium
      - run: pnpm test
      - run: pnpm test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build
      - name: Start it and wait until it is healthy
        run: |
          docker compose --profile demo up -d
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4317/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Import an example recording and run it against the bundled mock sites
        run: |
          id=$(curl -fsS -X POST http://127.0.0.1:4317/api/recordings -H 'content-type: application/json' \
            --data @examples/recordings/list-detail.jobtrace.json | jq -r .id)
          run=$(curl -fsS -X POST "http://127.0.0.1:4317/api/recordings/$id/runs" -H 'content-type: application/json' -d '{}' | jq -r .id)
          for attempt in $(seq 1 60); do
            status=$(curl -fsS "http://127.0.0.1:4317/api/runs/$run" | jq -r .run.status)
            case "$status" in queued|running) sleep 2 ;; *) break ;; esac
          done
          echo "run status: $status"
          test "$status" = succeeded
          test "$(curl -fsS "http://127.0.0.1:4317/api/runs/$run" | jq '.jobs | length')" = 8
